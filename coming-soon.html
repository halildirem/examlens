<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXAMLENS — Coming Soon</title>
<link rel="icon" type="image/png" href="./assets/images/examlens_logo.png">
<style>
  :root{
    --bg-0:#0a1420;
    --bg-1:#0d1b2e;
    --bg-2:#132030;
    --line:#263d5c;
    --gold:#c9a84c;
    --gold-light:#dfc070;
    --gold-soft:#e8d9a8;
    --ivory:#f0ead8;
    --text:#e7edf5;
    --text-dim:#b0a898;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
  }

  body{
    font-family:'Georgia','Times New Roman',serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(201,168,76,0.08), transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(201,168,76,0.06), transparent 50%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1) 55%, var(--bg-2));
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow:hidden;
  }

  .card{
    position:relative;
    text-align:center;
    max-width:560px;
    width:100%;
    padding:56px 40px;
    animation:rise 1s ease-out both;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .mark{
    width:88px;
    height:88px;
    margin:0 auto 24px;
    display:block;
    filter:drop-shadow(0 0 18px rgba(201,168,76,0.45));
  }

  .brand{
    font-family:'DM Sans', system-ui, sans-serif;
    letter-spacing:0.16em;
    font-size:1.9rem;
    font-weight:700;
    text-transform:uppercase;
    margin:0 0 18px;
  }

  .brand .exam{ color:var(--ivory); }
  .brand .lens{ color:var(--gold); }

  h1{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:clamp(2.2rem, 6vw, 3.4rem);
    font-weight:400;
    line-height:1.15;
    margin:0 0 20px;
    color:var(--text);
  }

  h1 em{
    font-style:italic;
    color:var(--gold-soft);
  }

  .rule{
    width:64px;
    height:1px;
    margin:0 auto 24px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  p.sub{
    font-size:1.05rem;
    line-height:1.7;
    color:var(--text-dim);
    margin:0 auto;
    max-width:420px;
    font-family:Georgia, serif;
  }

  .footer{
    margin-top:44px;
    font-size:12px;
    letter-spacing:0.12em;
    color:#5c7192;
    text-transform:uppercase;
  }

  /* subtle drifting particles */
  .glow{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:-1;
  }
  .glow span{
    position:absolute;
    width:3px;
    height:3px;
    background:var(--gold);
    border-radius:50%;
    opacity:0.5;
    animation:float 12s linear infinite;
  }
  .glow span:nth-child(1){ left:8%;  top:80%; animation-delay:0s;  }
  .glow span:nth-child(2){ left:22%; top:60%; animation-delay:2s;  }
  .glow span:nth-child(3){ left:47%; top:90%; animation-delay:4s;  }
  .glow span:nth-child(4){ left:68%; top:70%; animation-delay:1s;  }
  .glow span:nth-child(5){ left:85%; top:85%; animation-delay:3s;  }
  .glow span:nth-child(6){ left:35%; top:75%; animation-delay:5s;  }

  @keyframes float{
    0%   { transform:translateY(0)    scale(1);   opacity:0; }
    10%  { opacity:0.6; }
    90%  { opacity:0.3; }
    100% { transform:translateY(-90vh) scale(0.4); opacity:0; }
  }

  @media (max-width:480px){
    .card{ padding:40px 24px; }
  }
</style>
</head>
<body>

  <div class="glow" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <main class="card">
    <img class="mark" src="./assets/images/examlens_logo.png" alt="ExamLens Logo" />

    <p class="brand"><span class="exam">Exam</span><span class="lens">Lens</span></p>
    <h1>Something <em>thoughtful</em><br>is on its way</h1>
    <div class="rule"></div>
    <p class="sub">We're putting the finishing touches on the Educator Evaluation Portal. Thanks for your patience — check back soon.</p>

    <div class="footer">Coming Soon</div>
  </main>

</body>
</html>
